<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 100px;
        height: 100px;
        background-color: red;
      }
      div:hover {
        animation-name: squre;
        animation-duration: 2s;
      }

      @keyframes squre {
        0% {
          left: 0px;
          top: 0px;
        }
        25% {
          left: 0px;
          top: 200px;
        }
      }
    </style>
  </head>
  <body>
    <div></div>
  </body>
</html>
